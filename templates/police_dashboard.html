<!DOCTYPE html>
<html>

<head>

    <title>Police Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h2>Crime Reporting System</h2>

    <a href="{{ url_for('logout') }}"
       class="logout-button">

        Logout

    </a>

</header>


<div class="dashboard-page">

    <h1>Police Dashboard</h1>

    <h3>
        Welcome, {{ name }}
    </h3>


    <div class="dashboard-container">


        <!-- NEW COMPLAINTS -->

        <div class="dashboard-card">

            <h2>New Complaints</h2>

            <p>
                View complaints submitted by citizens.
            </p>

            <a href="{{ url_for('police_complaints') }}"
               class="dashboard-button">

                View Complaints

            </a>

        </div>


        <!-- ASSIGNED CASES -->

        <div class="dashboard-card">

            <h2>Assigned Cases</h2>

            <p>
                View and manage cases picked by you.
            </p>

            <a href="{{ url_for('assigned_cases') }}"
               class="dashboard-button">

                View Cases

            </a>

        </div>


        <!-- CASE INVESTIGATION -->

        <div class="dashboard-card">

            <h2>Case Investigation</h2>

            <p>
                Update the status of assigned complaints.
            </p>

            <a href="{{ url_for('case_investigation') }}"
               class="dashboard-button">

                Investigation

            </a>

        </div>


    </div>

</div>

</body>

</html>
